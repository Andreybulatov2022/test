<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Курс на зачёт</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Раскладка: беговая дорожка. Широкая шапка с дорожками, липкие вкладки, под ними карточки-секции на светлом поле. */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --ink:#14202B; --muted:#586674; --line:#D8DEE4; --soft:#E6EBF0;
  --track:#D9421C; --track-ink:#FFFFFF; --lane:#1D5DB0; --good:#1E8A57; --warn:#A8690A; --bad:#C0392B;
  --f-display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif; --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E151C; --surface:#17212B; --ink:#E7EDF3; --muted:#9AA8B5; --line:#2A3743; --soft:#1F2B36;
  --track:#FF6A3D; --track-ink:#14202B; --lane:#6DAAF2; --good:#43C98A; --warn:#E3A33C; --bad:#FF7B6B; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0E151C; --surface:#17212B; --ink:#E7EDF3; --muted:#9AA8B5; --line:#2A3743; --soft:#1F2B36;
  --track:#FF6A3D; --track-ink:#14202B; --lane:#6DAAF2; --good:#43C98A; --warn:#E3A33C; --bad:#FF7B6B; color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);margin:0;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:980px;margin-inline:auto}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;line-height:1.1;margin:0;text-wrap:balance}
h2{font-size:1.75rem} h3{font-size:1.25rem} h4{margin:0;font-size:1rem}
p{margin:.4em 0} small,.muted{color:var(--muted)} .num{font-variant-numeric:tabular-nums}
a{color:var(--lane)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--lane);outline-offset:2px;border-radius:4px}
header.hero{margin-inline:-16px;padding:28px 16px 20px;background:
  repeating-linear-gradient(90deg,transparent 0 calc(100% - 1px),transparent 0),
  linear-gradient(180deg,var(--track),color-mix(in srgb,var(--track) 78%,#000));color:var(--track-ink);position:relative;overflow:hidden}
header.hero:after{content:"";position:absolute;inset:auto 0 0 0;height:34px;background:
  repeating-linear-gradient(90deg,rgba(255,255,255,.55) 0 28px,transparent 28px 56px);opacity:.28;
  mask:linear-gradient(0deg,#000,transparent)}
header.hero .wrap{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
header.hero h1{font-size:clamp(2.2rem,7vw,3.6rem);text-transform:uppercase;letter-spacing:.03em}
header.hero p{margin:.2em 0 0;max-width:46ch;opacity:.92}
.theme-btn{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.5);color:inherit;border-radius:20px;padding:6px 14px}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin-inline:-16px;padding-inline:16px;background:var(--bg);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:12px 12px 9px;white-space:nowrap;font-weight:600;color:var(--muted)}
nav.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--track)}
section.tab{padding-block:20px;display:grid;gap:20px}
section.tab[hidden]{display:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card.flat{border-style:dashed;background:transparent}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.gc{grid-template-columns:repeat(auto-fit,minmax(min(100%,430px),1fr))}
.card>h2,.card>h3{margin-bottom:10px}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{justify-content:space-between}
.pill{display:inline-block;font-size:.78rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;border-radius:20px;padding:2px 10px;background:var(--soft);color:var(--muted)}
.pill.track{background:var(--track);color:var(--track-ink)} .pill.good{background:var(--good);color:#fff} .pill.warn{background:var(--warn);color:#fff}
.big{font-family:var(--f-display);font-weight:700;font-size:2.6rem;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:1rem;font-family:var(--f-body);font-weight:500}
.btn{background:var(--track);color:var(--track-ink);border:0;border-radius:8px;padding:9px 16px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:5px 10px;font-size:.9rem}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:4px 12px;font-size:.9rem}
.chip[aria-pressed=true],.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
label.f{display:grid;gap:3px;font-size:.88rem;color:var(--muted);min-width:0}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px;width:100%;min-width:0;color:var(--ink)}
.form{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.bar{height:10px;border-radius:5px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--track)}
.bar.lane>i{background:var(--lane)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
ul.clean{margin:.3em 0;padding-left:1.1em} ul.clean li{margin:.15em 0}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
details{border-top:1px solid var(--line);padding-block:8px} details:first-of-type{border-top:0}
summary{cursor:pointer;font-weight:600}
.day{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start}
.day .dn{font-family:var(--f-display);font-weight:700;line-height:1;text-align:center;min-width:46px}
.day .dn b{display:block;font-size:1.7rem} .day .dn span{font-size:.75rem;color:var(--muted);text-transform:uppercase}
.day.done{opacity:.6}
.kind{width:6px;align-self:stretch;border-radius:3px;background:var(--line)}
.k-run{background:var(--track)} .k-shuttle{background:var(--lane)} .k-str{background:var(--ink)} .k-test{background:var(--warn)}
.chk{width:22px;height:22px;accent-color:var(--track)}
.fig{background:var(--soft);border-radius:8px;width:100%;height:auto}
.fig .bone{stroke:var(--ink);stroke-width:4.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.fig .far{opacity:.35}
.fig .eq{stroke:var(--muted);stroke-width:3;fill:none;stroke-linecap:round}
.fig .head{fill:var(--surface);stroke:var(--ink);stroke-width:3.2}
.fig .wt{fill:var(--track);stroke:none}
.fig text{font:600 7px var(--f-body);fill:var(--muted)}
.emoji{font-size:2.4rem;line-height:1}
.chartbox{position:relative}
.chartbox svg{width:100%;height:auto;display:block;overflow:visible}
.chartbox text{font:15px var(--f-body);fill:var(--muted)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:.82rem;padding:5px 9px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-120%);z-index:3}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.88rem;color:var(--muted)}
.legend i{display:inline-block;width:18px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.warnbox{border-left:4px solid var(--warn);background:color-mix(in srgb,var(--warn) 12%,var(--surface));padding:10px 14px;border-radius:6px}
.goodbox{border-left:4px solid var(--good);background:color-mix(in srgb,var(--good) 10%,var(--surface));padding:10px 14px;border-radius:6px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:24px;z-index:9;font-weight:600}
@media (max-width:520px){.big{font-size:2.2rem} .day{grid-template-columns:auto 1fr}.day .cb{grid-column:2}}
@media (prefers-reduced-motion:no-preference){.bar>i{transition:width .5s}}
</style>

</head>

function niceTicks(lo,hi,n=4){ const span=hi-lo||1, step0=span/n, mag=Math.pow(10,Math.floor(Math.log10(step0))); const r=step0/mag; const step=(r<1.5?1:r<3?2:r<7?5:10)*mag; const a=Math.floor(lo/step)*step, b=Math.ceil(hi/step)*step; const t=[]; for(let v=a;v<=b+step/2;v+=step) t.push(+v.toFixed(6)); return t; }
function lineChart(host,o){
  const W=640,H=o.h||230,m={l:54,r:84,t:16,b:30};
  const all=o.series.flatMap(s=>s.pts); if(o.target!=null) all.push({x:all[0]?.x||0,y:o.target});
  if(!all.length){ host.innerHTML='<p class="muted">Пока нет данных.</p>'; return; }
  let xs=all.map(p=>p.x), x0=o.x0??Math.min(...xs), x1=o.x1??Math.max(...xs); if(x1===x0) x1=x0+864e5*7;
  let ys=all.map(p=>p.y), t=niceTicks(Math.min(...ys),Math.max(...ys)); const y0=t[0], y1=t[t.length-1];
  const X=x=>m.l+(x-x0)/(x1-x0)*(W-m.l-m.r), Y=y=>H-m.b-(y-y0)/(y1-y0)*(H-m.t-m.b);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.title)}">`;
  t.forEach(v=>{ s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${m.l-6}" y="${Y(v)+4}" text-anchor="end">${esc(o.yf(v))}</text>`; });
  const days=(x1-x0)/864e5, stepD=days>70?28:days>35?14:7;
  for(let d=0;d<=days+0.01;d+=stepD){ const x=x0+d*864e5, dt=new Date(x); s+=`<text x="${X(x)}" y="${H-8}" text-anchor="middle">${dlabel(dt)}</text>`; }
  if(o.target!=null) s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(o.target)}" y2="${Y(o.target)}" stroke="var(--good)" stroke-width="1.5" stroke-dasharray="6 4"/><text x="${W-m.r+4}" y="${Y(o.target)+4}" fill="var(--good)" style="fill:var(--good)">цель ${esc(o.yf(o.target))}</text>`;
  o.series.forEach(se=>{
    if(!se.pts.length) return; const pts=se.pts.slice().sort((a,b)=>a.x-b.x);
    s+=`<polyline fill="none" stroke="${se.c}" stroke-width="2" ${se.dash?`stroke-dasharray="${se.dash}"`:''} points="${pts.map(p=>X(p.x)+','+Y(p.y)).join(' ')}"/>`;
    if(se.dots) pts.forEach(p=>{ s+=`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="4" fill="${se.c}" stroke="var(--surface)" stroke-width="2"/>`; });
  });
  const todayX=Date.now(); if(todayX>=x0&&todayX<=x1) s+=`<line x1="${X(todayX)}" x2="${X(todayX)}" y1="${m.t}" y2="${H-m.b}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="2 3"/>`;
  s+=`<line id="cx" y1="${m.t}" y2="${H-m.b}" stroke="var(--muted)" stroke-width="1" visibility="hidden"/><rect x="${m.l}" y="0" width="${W-m.l-m.r}" height="${H}" fill="transparent" id="hit"/></svg><div class="tip" hidden></div>`;
  host.innerHTML=`<div class="chartbox">${s}</div><div class="legend">${o.series.map(se=>`<span><i style="background:${se.c}"></i>${esc(se.name)}</span>`).join('')}${o.target!=null?'<span><i style="background:var(--good)"></i>цель</span>':''}</div>`;
  const box=$('.chartbox',host), svg=$('svg',box), tip=$('.tip',box), cx=$('#cx',box);
  const real=o.series.filter(se=>se.dots).flatMap(se=>se.pts.map(p=>({...p,n:se.name})));
  $('#hit',box).addEventListener('pointermove',e=>{
    const r=svg.getBoundingClientRect(), px=(e.clientX-r.left)/r.width*W; if(!real.length) return;
    let best=real[0]; real.forEach(p=>{ if(Math.abs(X(p.x)-px)<Math.abs(X(best.x)-px)) best=p; });
    cx.setAttribute('x1',X(best.x)); cx.setAttribute('x2',X(best.x)); cx.setAttribute('visibility','visible');
    tip.hidden=false; tip.textContent=dlabel(new Date(best.x))+': '+o.yf(best.y); tip.style.left=(X(best.x)/W*100)+'%'; tip.style.top=(Y(best.y)/H*100)+'%';
  });
  $('#hit',box).addEventListener('pointerleave',()=>{ tip.hidden=true; cx.setAttribute('visibility','hidden'); });
}
function stackBars(host,o){
  const W=640,H=230,m={l:54,r:16,t:16,b:30}, n=o.cats.length, tot=o.cats.map((_,i)=>o.series.reduce((a,s)=>a+s.v[i],0));
  const t=niceTicks(0,Math.max(...tot,o.target||0)), top=t[t.length-1], Y=v=>H-m.b-v/top*(H-m.t-m.b), bw=(W-m.l-m.r)/n;

  o.cats.forEach((c,i)=>{ let acc=0; const x=m.l+i*bw+bw*.2, w=bw*.6;

  el.innerHTML=`<div class="card"><h2>Что купить</h2><p>Общий бюджет на экипировку и еду: <b>${b.toLocaleString('ru')} ₽</b>. Обязательный минимум стоит ${lo.toLocaleString('ru')}–${hi.toLocaleString('ru')} ₽. Если уложиться в минимум, на еду в первый месяц останется около <b>${left.toLocaleString('ru')} ₽</b>. Всё остальное в списке покупай позже. Начни с кроссовок: они защищают колени.</p>
   <div class="bar" style="margin:10px 0 4px"><i style="width:${Math.min(100,Math.round(spent/b*100))}%"></i></div><small class="muted">Потрачено на экипировку ${spent.toLocaleString('ru')} ₽ из ${b.toLocaleString('ru')} ₽. Впиши цену рядом с покупкой.</small></div>
   <div class="card"><h3>Как выбирать кроссовки</h3><svg class="fig" viewBox="0 0 220 90" role="img" aria-label="Схема кроссовка"><path class="bone" d="M20 62 C20 40 30 30 45 28 L62 26 C75 36 100 38 115 40 C150 44 190 50 196 62 L196 70 L20 70Z" fill="var(--surface)"/><path class="eq" d="M20 70H198"/><path d="M26 74H196" stroke="var(--track)" stroke-width="6" stroke-linecap="round"/><path class="eq" stroke-dasharray="3 3" d="M196 44V24"/><text x="150" y="20">запас 1 см</text><text x="22" y="22">пятка без люфта</text><text x="70" y="88">амортизирующая подошва</text></svg>
   <ul class="clean">${D.shoes.map(s=>`<li>${esc(s)}</li>`).join('')}</ul><p class="muted">Меряй вечером. Тренируйся в тех же кроссовках, в которых будешь сдавать бег и челнок, и проверь, что подошва в зале не скользит.</p></div>
   ${groups.map(gr=>`<div class="card"><h3>${esc(gr)}</h3>${D.gear.map((g,i)=>[g,i]).filter(([g])=>g.g===gr).map(([g,i])=>`<details><summary>${g.must?'':'<span class="pill">по желанию</span> '}${esc(g.n)} <span class="muted num">· ${g.lo.toLocaleString('ru')}–${g.hi.toLocaleString('ru')} ₽</span></summary><ul class="clean">${g.how.map(h=>`<li>${esc(h)}</li>`).join('')}</ul><label class="f" style="max-width:180px">Купил за, ₽<input type="number" data-gear="${i}" value="${S.gear[i]??''}"></label></details>`).join('')}</div>`).join('')}
   <div class="card"><h3>В парке</h3><ul class="clean"><li>Проверь турник: не шатается, перекладина шершавая, диаметр около 3 см. Не тренируйся на мокрой перекладине.</li><li>Скамейка для приседа и подъёмов должна быть неподвижной.</li><li>Ровную площадку 10 метров для челнока размерь шагами или рулеткой, отметь концы камнями.</li><li>Вечером надевай светоотражающие элементы.</li><li>Одевайся по принципу «зябко в первые 5 минут»: после разминки станет тепло.</li></ul></div>`;
  $$('[data-gear]',el).forEach(i=>i.onchange=()=>{ S.gear[i.dataset.gear]=i.value; save(); R_.gear(); });
};

/* ---- Что исправлено ---- */
R_.why=function(){
  const el=$('#t-why');
  el.innerHTML=`<div class="card"><h2>Что было не так в твоём плане</h2><p>Я разобрал таблицу из файла: 20-дневный блок, 10 недель по 2 тренировки, меню на неделю и покупки.</p>
  <div class="grid">${D.analysis.map(([a,b])=>`<div><h4>${esc(a)}</h4><p class="muted">${esc(b)}</p></div>`).join('')}</div></div>
  <div class="card"><h3>Как устроен новый план</h3><ul class="clean"><li>Недели 1–2: старт, можно заниматься почти каждый день, но нагрузка чередуется.</li><li>Недели 3–16: две сессии в неделю (А: бег и подтягивания, Б: челнок и ноги) плюс пятиминутные подтягивания каждый день.</li><li>Недели 4, 8, 12, 16: контроль бега, подтягиваний и челнока.</li><li>Питание: дефицит около 20%, белок около 1,5 г на кг, 4 приёма пищи.</li></ul></div>
  <div class="card"><h3>Что реалистично</h3><ul class="clean"><li>Бег 1 км: с 5:10 до ~4:40 за 12 недель, до 4:30 к 16-й неделе.</li><li>Челночный: ~26,2 с за 12 недель, 25 с позже, это самый зависимый от техники норматив.</li><li>Подтягивания: 9–10 за 12 недель. 15 при весе 90 кг заметно быстрее приходят вместе со снижением веса.</li><li>Живот: минус 5–7 кг за 12 недель, талия минус 6–9 см. Кубики потребуют ещё несколько месяцев.</li><li>Проверь свой норматив для возраста 40+: он может быть мягче целей из таблицы. Цели можно поменять в разделе «Дневник».</li></ul></div>`;
};

/* ---------- запуск ---------- */
const tabsEl=$('#tabs'); tabsEl.innerHTML=TABS.map(([k,n])=>`<button role="tab" type="button" data-t="${k}" aria-selected="false">${n}</button>`).join('');
$$('#tabs button').forEach(b=>b.onclick=()=>showTab(b.dataset.t));
$('#themeBtn').onclick=()=>{ const r=document.documentElement, cur=r.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'); r.setAttribute('data-theme',cur==='dark'?'light':'dark'); };
const hh=location.hash.slice(1); showTab(R_[hh]?hh:(S.tab&&R_[S.tab]?S.tab:'today'));
})();
</script>
